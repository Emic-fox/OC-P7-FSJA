# Configuration de l'analyse SonarQube Cloud du front-end.
# L'organisation et la clé de projet sont passées par le workflow CI.

sonar.sourceEncoding=UTF-8

# Code de production : tout src/, sauf les tests
sonar.sources=src
sonar.exclusions=**/*.spec.ts

# Tests : les fichiers *.spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Couverture produite par Karma (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/microcrm/lcov.info