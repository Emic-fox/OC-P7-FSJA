# Profil d'exécution en conteneur, inclus par l'image Docker (SPRING_PROFILES_INCLUDE dans le Dockerfile).

# Bannière de démarrage désactivée : écrite hors de Logback, elle ne serait pas au format JSON (logback-spring.xml)
spring.main.banner-mode=off

# Journal d'accès de Tomcat : une ligne JSON par requête (méthode, chemin sans query string, statut, durée en ms),
# écrite sur la sortie standard du conteneur et collectée par la stack Elastic (monitoring/).
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern={"log_type":"access","http_method":"%m","url_path":"%U","http_status":%s,"duration_ms":%{ms}T}
