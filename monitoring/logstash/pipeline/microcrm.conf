# Pipeline MicroCRM : logs reçus de Filebeat -> JSON décodé -> un data stream par service

input {
  beats {
    port => 5044
  }
}

filter {
  # Service d'origine : label Docker Compose
  if [container][labels][com_docker_compose_service] == "back" {
    mutate { add_field => { "[data_stream][dataset]" => "microcrm.back" } }

    # Logs applicatifs (Logback) et journal d'accès Tomcat (log_type = access), décodés à la racine
    json {
      source => "message"
    }

    # Healthcheck Docker, sans intérêt pour l'analyse
    if [log_type] == "access" and [url_path] =~ /^\/actuator/ {
      drop {}
    }

  } else if [container][labels][com_docker_compose_service] == "front" {
    mutate { add_field => { "[data_stream][dataset]" => "microcrm.front" } }

    # Logs Caddy, sous [caddy] pour éviter les conflits avec les champs ajoutés par Filebeat
    json {
      source => "message"
      target => "caddy"
    }

    # Horodatage de Caddy : secondes depuis l'epoch
    date {
      match => ["[caddy][ts]", "UNIX"]
    }
  }
}

output {
  # logs-<dataset>-default
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
  }
}
